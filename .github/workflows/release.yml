name: Release

# Builds PrintPrep desktop installers for Windows, macOS and Linux.
# Triggered by pushing a tag such as `v0.1.0`, or manually from the
# Actions tab (supply the tag to publish under).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the release under (e.g. v0.1.0-test.1)'
        required: true
        default: 'v0.1.0-test.1'

permissions:
  contents: write

jobs:
  test:
    name: Unit tests (print calculations)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libappindicator3-dev patchelf
      - name: cargo test
        working-directory: ./src-tauri
        run: cargo test --lib

  # The three build jobs run at once, so if each of them creates the release
  # itself they race: whichever finishes second gets `already_exists` and
  # drops its installers on the floor. Creating it once, up front, means the
  # builders only ever upload.
  create-release:
    name: Create the release
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_BODY: |
        Desktop test build of **PrintPrep — Booklet, Flyer & Brochure Creator**.

        Download the installer for your platform from the assets below.

        - **Windows** — `.msi` or `.exe` (NSIS)
        - **macOS** — `.dmg` (universal: Apple Silicon and Intel)
        - **Linux** — `.AppImage` (run directly) or `.deb`

        Builds are unsigned, so the OS will warn on first launch:
        Windows SmartScreen → *More info* → *Run anyway*;
        macOS → right-click the app → *Open*, or
        `xattr -cr /Applications/PrintPrep.app`.
    steps:
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            let release;
            try {
              // Re-running a partly failed build must top up the same
              // release rather than fail on the existing tag.
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              core.info(`Reusing release ${release.id} for ${tag}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `PrintPrep ${tag}`,
                body: process.env.RELEASE_BODY,
                draft: false,
                prerelease: true,
              })).data;
              core.info(`Created release ${release.id} for ${tag}`);
            }
            core.setOutput('release_id', release.id);

  build:
    name: Build ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux (AppImage + .deb)
            args: ''
          - platform: windows-latest
            label: Windows (.msi + .exe)
            args: ''
          # One universal binary covers both Apple Silicon and Intel Macs.
          # GitHub has retired the macos-13 Intel runners, so cross-compiling
          # a universal target from the ARM runner is the supported route.
          - platform: macos-latest
            label: macOS Universal (.dmg)
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libappindicator3-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The release already exists, so this only uploads to it.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
