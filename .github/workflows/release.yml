name: Release

# Builds PrintPrep desktop installers for Windows, macOS and Linux.
# Triggered by pushing a tag such as `v0.1.0`, or manually from the
# Actions tab (supply the tag to publish under).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the release under (e.g. v0.1.0-test.1)'
        required: true
        default: 'v0.1.0-test.1'

permissions:
  contents: write

jobs:
  test:
    name: Unit tests (print calculations)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libappindicator3-dev patchelf
      - name: cargo test
        working-directory: ./src-tauri
        run: cargo test --lib

  build:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux (AppImage + .deb)
            args: ''
          - platform: windows-latest
            label: Windows (.msi + .exe)
            args: ''
          # One universal binary covers both Apple Silicon and Intel Macs.
          # GitHub has retired the macos-13 Intel runners, so cross-compiling
          # a universal target from the ARM runner is the supported route.
          - platform: macos-latest
            label: macOS Universal (.dmg)
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libappindicator3-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'PrintPrep ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Desktop test build of **PrintPrep — Booklet, Flyer & Brochure Creator**.

            Download the installer for your platform from the assets below.

            - **Windows** — `.msi` or `.exe` (NSIS)
            - **macOS** — `.dmg` (universal: Apple Silicon and Intel)
            - **Linux** — `.AppImage` (run directly) or `.deb`

            Builds are unsigned, so the OS will warn on first launch:
            Windows SmartScreen → *More info* → *Run anyway*;
            macOS → right-click the app → *Open*, or
            `xattr -cr /Applications/PrintPrep.app`.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
